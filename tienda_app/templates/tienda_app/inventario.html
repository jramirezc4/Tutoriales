<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Inventario</title>
</head>
<body>
    <h1>Inventario actual</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Libro</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for item in inventario %}
                <tr>
                    <td>{{ item.libro.id }}</td>
                    <td>{{ item.libro.titulo }}</td>
                    <td>{{ item.cantidad }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No hay inventario registrado.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
